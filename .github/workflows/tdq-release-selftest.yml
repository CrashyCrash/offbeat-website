name: TDQ release-gate source regression

# Intentionally runs UNTRUSTED PR code only on a read-only GitHub-hosted
# runner, without credentials or secrets. The authoritative release gate
# executes only the reviewed implementation from protected main.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/tdq_release_gate.py"
      - ".github/scripts/tdq_signed_release.py"
      - ".github/workflows/tdq-signed-local-release.yml"
      - ".github/scripts/tdq_draft_triage.py"
      - ".github/workflows/tdq-editorial-release.yml"
      - ".github/workflows/tdq-release-selftest.yml"

permissions:
  contents: read

jobs:
  gate-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile gate and verify negative release cases
        shell: bash
        run: |
          set -euo pipefail
          # Bootstrap PR installs the test harness before the gate exists.
          # The next PR containing gate code MUST pass its real self-tests.
          if [[ -f .github/scripts/tdq_release_gate.py ]]; then
            python3 -m py_compile .github/scripts/tdq_draft_triage.py .github/scripts/tdq_release_gate.py
            python3 .github/scripts/tdq_draft_triage.py --self-test
            python3 .github/scripts/tdq_release_gate.py --self-test
          fi
          if [[ -f .github/scripts/tdq_signed_release.py ]]; then
            python3 -m py_compile .github/scripts/tdq_signed_release.py
            python3 .github/scripts/tdq_signed_release.py --self-test
          else
            echo "Trusted read-only gate selftest scaffold installed."
          fi
