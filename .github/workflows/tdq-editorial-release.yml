name: TDQ protected editorial release readiness

# This trusted GitHub Actions workflow GATES and conditionally MERGES, but
# cannot supply its own independent factual approval. PR text/head is data.
# It writes immutable-head status contexts; current main branch protections
# can require those GitHub-Actions-origin statuses after a reviewed migration.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: tdq-editorial-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  classify-narrow-editorial-draft:
    # A trusted GitHub service grants ONLY the pre-authorized, text-only lane.
    # It does not approve fact claims, move drafts to ready, or merge a PR.
    if: github.event_name == 'pull_request_target' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize') && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'tdq/proof-auto-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout reviewed protected source only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Independently classify exact-head editorial safety
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 .github/scripts/tdq_release_gate.py --pr "$PR_NUMBER" --expected-head "$EVENT_HEAD" --classify
          pr="$(gh api "repos/CrashyCrash/offbeat-website/pulls/${PR_NUMBER}")"
          echo "$pr" | jq -e --arg h "$EVENT_HEAD" '
            .head.sha == $h and .state == "open" and .draft == true
            and .head.repo.full_name == "CrashyCrash/offbeat-website"
            and ([.labels[].name] | index("tdq-release-hold") == null)
          ' >/dev/null
          # Only the trusted GitHub Actions service, after an exact-source
          # qualification, adds the authorization label. No owner handoff.
          # The label event triggers another separate protected SHA check.
          gh api --method POST "repos/CrashyCrash/offbeat-website/issues/${PR_NUMBER}/labels" \
            -f 'labels[]=tdq-editorial-release' >/dev/null

  editorial-release:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'tdq/proof-auto-')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout ONLY the current trusted protected default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify gate implementation on protected main
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/tdq_draft_triage.py .github/scripts/tdq_release_gate.py
          python3 .github/scripts/tdq_draft_triage.py --self-test
          python3 .github/scripts/tdq_release_gate.py --self-test

      - name: Publish exact-head source + independent-review status contexts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/tdq_release_gate.py --pr "$PR_NUMBER" --expected-head "$PR_HEAD_SHA"

  enroll-independent-review:
    # Drafts remain DRAFT and reserve K11 reviewer capacity until an external
    # exact-head Copilot APPROVED review is observed. There is no self-approval.
    needs: [editorial-release]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'tdq/proof-auto-')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
      statuses: read
    steps:
      - name: Request genuine separate review or un-draft only after approval
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/CrashyCrash/offbeat-website/pulls/${PR_NUMBER}")"
          echo "$pr" | jq -e --arg h "$EVENT_HEAD" '
            .head.sha == $h and .state == "open" and .draft == true
            and .head.repo.full_name == "CrashyCrash/offbeat-website"
            and (.head.ref | startswith("tdq/proof-auto-"))
            and ([.labels[].name] | index("tdq-editorial-release") != null)
            and ([.labels[].name] | index("tdq-release-hold") == null)
          ' >/dev/null || exit 0
          current_main="$(gh api repos/CrashyCrash/offbeat-website/git/ref/heads/main --jq .object.sha)"
          test "$(echo "$pr" | jq -r .base.sha)" = "$current_main" || exit 0
          gh api "repos/CrashyCrash/offbeat-website/commits/${EVENT_HEAD}/status" |
            jq -e '
              [.statuses[] | select(.context == "TDQ Protected Editorial Source")][0].state == "success"
            ' >/dev/null || exit 0
          reviews="$(gh api "repos/CrashyCrash/offbeat-website/pulls/${PR_NUMBER}/reviews?per_page=100")"
          test "$(echo "$reviews" | jq 'length')" -lt 100 || exit 0
          last_copilot="$(echo "$reviews" | jq -r --arg h "$EVENT_HEAD" '
            [.[] | select(.user.login == "copilot-pull-request-reviewer[bot]" and .commit_id == $h)] |
            last | .state // ""
          ')"
          if [[ "$last_copilot" == APPROVED ]]; then
            # The new ready_for_review event re-runs the protected exact-head
            # reviewer gate before ANY native release can be attempted.
            gh pr ready "$PR_NUMBER" -R CrashyCrash/offbeat-website
            exit 0
          fi
          # A COMMENTED or CHANGES_REQUESTED review is NOT approval. Only a
          # new corrected K11 head can earn a fresh Copilot review request.
          if [[ -n "$last_copilot" ]]; then
            exit 0
          fi
          requested="$(gh api "repos/CrashyCrash/offbeat-website/pulls/${PR_NUMBER}/requested_reviewers")"
          if echo "$requested" | jq -e '
             any(.users[]; .login == "copilot-pull-request-reviewer[bot]")
          ' >/dev/null; then
            exit 0
          fi
          # This is a real API review request, not AI-authored 'review' text.
          # If Copilot is disabled, the request fails and the draft stays DRAFT.
          gh api --method POST "repos/CrashyCrash/offbeat-website/pulls/${PR_NUMBER}/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]' >/dev/null

  merge-when-native-protection-allows:
    # Successful independent review gate is necessary, not sufficient.
    # GitHub Actions is NOT the owner bypass actor in old DatBotty rulesets.
    needs: [editorial-release]
    if: needs.editorial-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - name: Recheck current protected native merge policy and exact candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Release authority is the independent GitHub reviewer + native
          # protected rules, NEVER the credentialed K11 worker or PR text.
          gh api repos/CrashyCrash/offbeat-website/rulesets/22973860 |
            jq -e '
              .enforcement == "active"
              and .target == "branch"
              and .source == "CrashyCrash/offbeat-website"
              and (.conditions.ref_name.include | index("refs/heads/main") != null)
              and ((.conditions.ref_name.exclude // []) | index("refs/heads/main") == null)
              and .current_user_can_bypass == "never"
              and ((.bypass_actors // []) |
                   all(.[]; .actor_type != "Integration" or .actor_id != 15368))
              and
              any(.rules[];
                .type == "pull_request"
                and .parameters.required_approving_review_count >= 1
                and .parameters.dismiss_stale_reviews_on_push == true
                and .parameters.required_review_thread_resolution == true)
              and
              any(.rules[];
                .type == "required_status_checks"
                and .parameters.strict_required_status_checks_policy == true
                and (
                  [.parameters.required_status_checks[]
                   | select(.context == "TDQ Protected Editorial Source"
                            and .integration_id == 15368)] | length == 1)
                and (
                  [.parameters.required_status_checks[]
                   | select(.context == "TDQ Independent Editorial Approval"
                            and .integration_id == 15368)] | length == 1)
                and (
                  [.parameters.required_status_checks[]
                   | select(.context | startswith("DatBotty "))] | length == 0))
            ' >/dev/null
          pr="$(gh api "repos/CrashyCrash/offbeat-website/pulls/${PR_NUMBER}")"
          echo "$pr" | jq -e --arg h "$EVENT_HEAD" '
              .state == "open" and .draft == false
              and .head.sha == $h and .head.repo.full_name == "CrashyCrash/offbeat-website"
              and .base.ref == "main"
              and ([.labels[].name] | index("tdq-editorial-release") != null)
              and ([.labels[].name] | index("tdq-release-hold") == null)
            ' >/dev/null
          current_main="$(gh api repos/CrashyCrash/offbeat-website/git/ref/heads/main --jq .object.sha)"
          test "$(echo "$pr" | jq -r .base.sha)" = "$current_main"
          # Recheck independent GitHub status contexts immediately before merge;
          # the provider will enforce required contexts/approvals once more.
          gh api "repos/CrashyCrash/offbeat-website/commits/${EVENT_HEAD}/status" |
            jq -e '
              .statuses as $statuses
              | ([$statuses[] | select(.context == "TDQ Protected Editorial Source")][0].state == "success")
                and
                ([$statuses[] | select(.context == "TDQ Independent Editorial Approval")][0].state == "success")
            ' >/dev/null
          # Do not trust an earlier green status after a Copilot dismissal.
          # Fetch a fresh authentic exact-head GitHub review immediately before
          # the atomic provider merge, which independently enforces approvals.
          reviews="$(gh api "repos/CrashyCrash/offbeat-website/pulls/${PR_NUMBER}/reviews?per_page=100")"
          echo "$reviews" | jq -e --arg h "$EVENT_HEAD" '
             (length < 100)
             and
             ([.[] | select(.user.login == "copilot-pull-request-reviewer[bot]")]
               | last | .state == "APPROVED" and .commit_id == $h)
             and
             ([.[] | select(.user.login != null)
               | {key: .user.login, value: .}] | from_entries
              | [.[] | select(.state == "CHANGES_REQUESTED")] | length == 0)
          ' >/dev/null
          # This GitHub Actions token has no owner-user bypass. A 405/409/422
          # from native protection is BLOCKED, not a reason to force a merge.
          gh api --method PUT "repos/CrashyCrash/offbeat-website/pulls/${PR_NUMBER}/merge" \
            -f sha="$EVENT_HEAD" -f merge_method=merge \
            -f commit_title="Release protected verified low-risk TDQ editorial PR #${PR_NUMBER}" |
            jq -e '.merged == true' >/dev/null
          echo "GitHub protected merge completed; public live-byte readback remains separate." >> "$GITHUB_STEP_SUMMARY"
