name: TDQ protected editorial release readiness

# This trusted GitHub Actions workflow is the RELEASE GATE, not a reviewer
# or a merger. Only main's protected checker executes. PR text/head is data.
# It writes immutable-head status contexts; current main branch protections
# can require those GitHub-Actions-origin statuses after a reviewed migration.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: tdq-editorial-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  editorial-release:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'tdq/proof-auto-')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout ONLY the current trusted protected default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify gate implementation on protected main
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/tdq_draft_triage.py .github/scripts/tdq_release_gate.py
          python3 .github/scripts/tdq_draft_triage.py --self-test
          python3 .github/scripts/tdq_release_gate.py --self-test

      - name: Publish exact-head source + independent-review status contexts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/tdq_release_gate.py --pr "$PR_NUMBER" --expected-head "$PR_HEAD_SHA"
