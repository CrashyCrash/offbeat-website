<svg viewBox="0 0 720 210" width="720" height="210" role="img" aria-label="Diagram: signal path from controller to laptop, master output, speakers and booth monitor" xmlns="http://www.w3.org/2000/svg"><text x="8" y="18" fill="#9a968d" font-size="12" letter-spacing="1.6" font-family="Inter, system-ui, sans-serif">WHERE THE SOUND ACTUALLY GOES</text><rect x="8" y="46" width="118" height="66" rx="8" fill="#121218" stroke="rgba(255,255,255,.12)"/><text x="67.0" y="70" text-anchor="middle" fill="#f4f1ec" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">Controller</text><text x="67.0" y="86" text-anchor="middle" fill="#7c7970" font-size="10" font-family="Inter, system-ui, sans-serif">USB out,</text><text x="67.0" y="99" text-anchor="middle" fill="#7c7970" font-size="10" font-family="Inter, system-ui, sans-serif">built-in interface</text><rect x="148" y="46" width="123" height="66" rx="8" fill="#121218" stroke="rgba(255,255,255,.12)"/><text x="209.5" y="70" text-anchor="middle" fill="#f4f1ec" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">Laptop</text><text x="209.5" y="86" text-anchor="middle" fill="#7c7970" font-size="10" font-family="Inter, system-ui, sans-serif">audio routed back</text><text x="209.5" y="99" text-anchor="middle" fill="#7c7970" font-size="10" font-family="Inter, system-ui, sans-serif">to the controller</text><rect x="288" y="46" width="123" height="66" rx="8" fill="#121218" stroke="rgba(255,255,255,.12)"/><text x="349.5" y="70" text-anchor="middle" fill="#f4f1ec" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">Master out</text><text x="349.5" y="86" text-anchor="middle" fill="#7c7970" font-size="10" font-family="Inter, system-ui, sans-serif">RCA or XLR</text><text x="349.5" y="99" text-anchor="middle" fill="#7c7970" font-size="10" font-family="Inter, system-ui, sans-serif">to the speakers</text><rect x="428" y="46" width="123" height="66" rx="8" fill="#121218" stroke="rgba(255,255,255,.12)"/><text x="489.5" y="70" text-anchor="middle" fill="#f4f1ec" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">Speakers</text><text x="489.5" y="86" text-anchor="middle" fill="#7c7970" font-size="10" font-family="Inter, system-ui, sans-serif">PA, amp or</text><text x="489.5" y="99" text-anchor="middle" fill="#7c7970" font-size="10" font-family="Inter, system-ui, sans-serif">active monitors</text><rect x="568" y="46" width="118" height="66" rx="8" fill="#121218" stroke="rgba(255,255,255,.12)"/><text x="627.0" y="70" text-anchor="middle" fill="#f4f1ec" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">Booth / monitor</text><text x="627.0" y="86" text-anchor="middle" fill="#7c7970" font-size="10" font-family="Inter, system-ui, sans-serif">same mix,</text><text x="627.0" y="99" text-anchor="middle" fill="#7c7970" font-size="10" font-family="Inter, system-ui, sans-serif">louder on stage</text><path d="M126 79 h14" stroke="#ff5a1f" stroke-width="1.6"/><path d="M140 79 l-5 -4 v8 z" fill="#ff5a1f"/><path d="M271 79 h14" stroke="#ff5a1f" stroke-width="1.6"/><path d="M285 79 l-5 -4 v8 z" fill="#ff5a1f"/><path d="M411 79 h14" stroke="#ff5a1f" stroke-width="1.6"/><path d="M425 79 l-5 -4 v8 z" fill="#ff5a1f"/><path d="M551 79 h14" stroke="#ff5a1f" stroke-width="1.6"/><path d="M565 79 l-5 -4 v8 z" fill="#ff5a1f"/><text x="8" y="140" fill="#9a968d" font-size="11" font-family="Inter, system-ui, sans-serif">Headphones plug into the controller and monitor the cue bus — they do not replace the master output.</text><text x="8" y="160" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">No sound at all? Check: master fader up → channel fader up → trim → crossfader centre → correct output device in software.</text><text x="8" y="180" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">Buzz or hum? Use balanced TRS/XLR for long runs, keep speaker cables away from power supplies, and gain-stage at the trim.</text></svg>