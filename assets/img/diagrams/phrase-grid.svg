<svg viewBox="0 0 720 210" width="720" height="210" role="img" aria-label="Diagram: a four-bar phrase counted in sixteenths, showing the downbeat" xmlns="http://www.w3.org/2000/svg"><text x="0" y="18" fill="#9a968d" font-size="12" letter-spacing="1.6" font-family="Inter, system-ui, sans-serif">THE 16-BEAT PHRASE, COUNTED</text><rect x="8" y="44" width="38" height="38" rx="6" fill="rgba(255,90,31,.20)" stroke="#ff5a1f"/><text x="27" y="68" text-anchor="middle" fill="#ff8a3d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">1</text><rect x="50" y="44" width="38" height="38" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/><text x="69" y="68" text-anchor="middle" fill="#9a968d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">2</text><rect x="92" y="44" width="38" height="38" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/><text x="111" y="68" text-anchor="middle" fill="#9a968d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">3</text><rect x="134" y="44" width="38" height="38" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/><text x="153" y="68" text-anchor="middle" fill="#9a968d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">4</text><text x="8" y="98" fill="#7c7970" font-size="10" font-family="Inter, system-ui, sans-serif">bar 1</text><rect x="180" y="44" width="38" height="38" rx="6" fill="rgba(255,90,31,.20)" stroke="#ff5a1f"/><text x="199" y="68" text-anchor="middle" fill="#ff8a3d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">5</text><rect x="222" y="44" width="38" height="38" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/><text x="241" y="68" text-anchor="middle" fill="#9a968d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">6</text><rect x="264" y="44" width="38" height="38" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/><text x="283" y="68" text-anchor="middle" fill="#9a968d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">7</text><rect x="306" y="44" width="38" height="38" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/><text x="325" y="68" text-anchor="middle" fill="#9a968d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">8</text><text x="180" y="98" fill="#7c7970" font-size="10" font-family="Inter, system-ui, sans-serif">bar 2</text><rect x="352" y="44" width="38" height="38" rx="6" fill="rgba(255,90,31,.20)" stroke="#ff5a1f"/><text x="371" y="68" text-anchor="middle" fill="#ff8a3d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">9</text><rect x="394" y="44" width="38" height="38" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/><text x="413" y="68" text-anchor="middle" fill="#9a968d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">10</text><rect x="436" y="44" width="38" height="38" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/><text x="455" y="68" text-anchor="middle" fill="#9a968d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">11</text><rect x="478" y="44" width="38" height="38" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/><text x="497" y="68" text-anchor="middle" fill="#9a968d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">12</text><text x="352" y="98" fill="#7c7970" font-size="10" font-family="Inter, system-ui, sans-serif">bar 3</text><rect x="524" y="44" width="38" height="38" rx="6" fill="rgba(255,90,31,.20)" stroke="#ff5a1f"/><text x="543" y="68" text-anchor="middle" fill="#ff8a3d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">13</text><rect x="566" y="44" width="38" height="38" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/><text x="585" y="68" text-anchor="middle" fill="#9a968d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">14</text><rect x="608" y="44" width="38" height="38" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/><text x="627" y="68" text-anchor="middle" fill="#9a968d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">15</text><rect x="650" y="44" width="38" height="38" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/><text x="669" y="68" text-anchor="middle" fill="#9a968d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">16</text><text x="524" y="98" fill="#7c7970" font-size="10" font-family="Inter, system-ui, sans-serif">bar 4</text><text x="8" y="126" fill="#9a968d" font-size="11" font-family="Inter, system-ui, sans-serif">1 2 3 4 · 2 2 3 4 · 3 2 3 4 · 4 2 3 4 — say it out loud while you mix.</text><text x="8" y="146" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">Kick on 1 and 3, snare or clap on 2 and 4. That is the skeleton of almost every house and techno record.</text><text x="8" y="166" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">When you can hear where beat 1 is without counting, you can mix in cleanly. That is the whole trick.</text></svg>