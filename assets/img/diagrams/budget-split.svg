<svg viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="Diagram: budget split for a 400 dollar first DJ rig" xmlns="http://www.w3.org/2000/svg"><text x="0" y="18" fill="#9a968d" font-size="12" letter-spacing="1.6" font-family="Inter, system-ui, sans-serif">HOW A $400 FIRST RIG ACTUALLY DIVIDES</text><rect x="0.0" y="40" width="394.0" height="34" rx="4" fill="#ff5a1f" opacity=".85"/><text x="198.0" y="62" text-anchor="middle" fill="#0b0b10" font-size="11" font-weight="700" font-family="Inter, system-ui, sans-serif">55%</text><rect x="396.0" y="40" width="106.0" height="34" rx="4" fill="#8cc4ff" opacity=".85"/><text x="450.0" y="62" text-anchor="middle" fill="#0b0b10" font-size="11" font-weight="700" font-family="Inter, system-ui, sans-serif">15%</text><rect x="504.0" y="40" width="55.6" height="34" rx="4" fill="#63d9a8" opacity=".85"/><text x="532.8" y="62" text-anchor="middle" fill="#0b0b10" font-size="11" font-weight="700" font-family="Inter, system-ui, sans-serif">8%</text><rect x="561.6" y="40" width="48.4" height="34" rx="4" fill="#ffc14d" opacity=".85"/><rect x="612.0" y="40" width="106.0" height="34" rx="4" fill="#ff7a7a" opacity=".85"/><text x="666.0" y="62" text-anchor="middle" fill="#0b0b10" font-size="11" font-weight="700" font-family="Inter, system-ui, sans-serif">15%</text><rect x="0" y="94" width="9" height="9" rx="2" fill="#ff5a1f"/><text x="16" y="102" fill="#9a968d" font-size="11" font-family="Inter, system-ui, sans-serif">Controller</text><text x="150" y="102" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">$220</text><rect x="0" y="116" width="9" height="9" rx="2" fill="#8cc4ff"/><text x="16" y="124" fill="#9a968d" font-size="11" font-family="Inter, system-ui, sans-serif">Headphones</text><text x="150" y="124" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">$60</text><rect x="0" y="138" width="9" height="9" rx="2" fill="#63d9a8"/><text x="16" y="146" fill="#9a968d" font-size="11" font-family="Inter, system-ui, sans-serif">Cables + adapter</text><text x="150" y="146" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">$32</text><rect x="0" y="160" width="9" height="9" rx="2" fill="#ffc14d"/><text x="16" y="168" fill="#9a968d" font-size="11" font-family="Inter, system-ui, sans-serif">Stand / riser</text><text x="150" y="168" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">$28</text><rect x="0" y="182" width="9" height="9" rx="2" fill="#ff7a7a"/><text x="16" y="190" fill="#9a968d" font-size="11" font-family="Inter, system-ui, sans-serif">Music + software</text><text x="150" y="190" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">$60</text><text x="420" y="102" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">The controller is most of the budget, but not all of it.</text><text x="420" y="121" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">Cables, a stand and spare pads are what</text><text x="420" y="140" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">people forget until the first gig.</text><text x="420" y="172" fill="#63d9a8" font-size="11" font-family="Inter, system-ui, sans-serif">Buy the controller used; buy headphones new.</text></svg>