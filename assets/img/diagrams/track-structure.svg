<svg viewBox="0 0 720 190" width="720" height="190" role="img" aria-label="Diagram: sections of a typical 128-bar house track with bar counts" xmlns="http://www.w3.org/2000/svg"><rect x="8.0" y="46" width="86.0" height="58" rx="6" fill="#2a2a36" stroke="rgba(255,255,255,.08)"/><text x="52.0" y="72" text-anchor="middle" fill="#9a968d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">Intro</text><text x="52.0" y="90" text-anchor="middle" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">16 bars</text><rect x="96.0" y="46" width="86.0" height="58" rx="6" fill="#3a3325" stroke="rgba(255,255,255,.08)"/><text x="140.0" y="72" text-anchor="middle" fill="#ffc14d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">Build</text><text x="140.0" y="90" text-anchor="middle" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">16 bars</text><rect x="184.0" y="46" width="174.0" height="58" rx="6" fill="#43251a" stroke="rgba(255,255,255,.08)"/><text x="272.0" y="72" text-anchor="middle" fill="#ff8a3d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">Drop</text><text x="272.0" y="90" text-anchor="middle" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">32 bars</text><rect x="360.0" y="46" width="86.0" height="58" rx="6" fill="#24283a" stroke="rgba(255,255,255,.08)"/><text x="404.0" y="72" text-anchor="middle" fill="#8cc4ff" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">Breakdown</text><text x="404.0" y="90" text-anchor="middle" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">16 bars</text><rect x="448.0" y="46" width="174.0" height="58" rx="6" fill="#43251a" stroke="rgba(255,255,255,.08)"/><text x="536.0" y="72" text-anchor="middle" fill="#ff8a3d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">Drop 2</text><text x="536.0" y="90" text-anchor="middle" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">32 bars</text><rect x="624.0" y="46" width="86.0" height="58" rx="6" fill="#2a2a36" stroke="rgba(255,255,255,.08)"/><text x="668.0" y="72" text-anchor="middle" fill="#9a968d" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">Outro</text><text x="668.0" y="90" text-anchor="middle" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">16 bars</text><text x="8" y="24" fill="#9a968d" font-size="12" letter-spacing="1.6" font-family="Inter, system-ui, sans-serif">A TYPICAL 128-BAR HOUSE EDIT</text><path d="M8 128 H712" stroke="rgba(255,255,255,.12)"/><line x1="8.0" y1="124" x2="8.0" y2="132" stroke="#7c7970"/><line x1="184.0" y1="124" x2="184.0" y2="132" stroke="#7c7970"/><line x1="360.0" y1="124" x2="360.0" y2="132" stroke="#7c7970"/><line x1="536.0" y1="124" x2="536.0" y2="132" stroke="#7c7970"/><line x1="712.0" y1="124" x2="712.0" y2="132" stroke="#7c7970"/><text x="8" y="152" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">Mix on phrase boundaries — bar 1, 33, 65, 97. Eight bars is the smallest unit worth moving.</text><text x="8" y="172" fill="#63d9a8" font-size="11" font-family="Inter, system-ui, sans-serif">Bring the new track in over the intro, swap bass at the drop, take the old one out across the breakdown.</text></svg>