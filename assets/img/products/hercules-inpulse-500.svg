<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <!-- Metal Chassis with Retractable Feet -->
  <rect x="10" y="15" width="580" height="330" rx="12" fill="#181822" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <polygon points="20,345 50,345 40,358 10,358" fill="#38bdf8"/> <!-- Foot left -->
  <polygon points="580,345 550,345 560,358 590,358" fill="#38bdf8"/> <!-- Foot right -->
  <!-- Jogs with Beatmatch Guide Lights -->
  <circle cx="120" cy="140" r="78" fill="#0b0b12" stroke="#f59e0b" stroke-width="2"/><circle cx="120" cy="140" r="26" fill="#1f1f2e"/>
  <circle cx="480" cy="140" r="78" fill="#0b0b12" stroke="#f59e0b" stroke-width="2"/><circle cx="480" cy="140" r="26" fill="#1f1f2e"/>
  <!-- Red/Green Guide Arrows -->
  <polygon points="120,50 128,58 112,58" fill="#ef4444"/>
  <polygon points="480,50 488,58 472,58" fill="#22c55e"/>
  <!-- 8 Rubber Pads -->
  <g transform="translate(50, 245)">
    <rect x="0" y="0" width="30" height="22" rx="3" fill="#222" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="36" y="0" width="30" height="22" rx="3" fill="#222" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="72" y="0" width="30" height="22" rx="3" fill="#222" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="108" y="0" width="30" height="22" rx="3" fill="#222" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <g transform="translate(410, 245)">
    <rect x="0" y="0" width="30" height="22" rx="3" fill="#222" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="36" y="0" width="30" height="22" rx="3" fill="#222" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="72" y="0" width="30" height="22" rx="3" fill="#222" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="108" y="0" width="30" height="22" rx="3" fill="#222" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <!-- Center Mixer with Aux Filter -->
  <rect x="230" y="30" width="140" height="300" rx="8" fill="#12121c"/>
  <text x="300" y="52" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">HERCULES INPULSE 500</text>
  <text x="300" y="68" fill="#f59e0b" font-size="8" font-family="sans-serif" text-anchor="middle">HARDWARE BEATMATCH GUIDE</text>
  <circle cx="300" cy="105" r="14" fill="#2a2a3c" stroke="#38bdf8" stroke-width="2"/> <!-- Big Filter knob -->
  <text x="300" y="108" fill="#fff" font-size="7" font-weight="bold" font-family="sans-serif" text-anchor="middle">FILTER</text>
  <rect x="255" y="270" width="90" height="6" rx="2" fill="#000"/><rect x="294" y="263" width="12" height="20" rx="2" fill="#fff"/>
</svg>