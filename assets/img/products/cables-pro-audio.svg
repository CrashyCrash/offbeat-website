<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%" height="100%">
  <!-- Gold Plated RCA Connectors -->
  <g transform="translate(60, 70)">
    <!-- Red RCA -->
    <rect x="0" y="10" width="70" height="24" rx="4" fill="#222" stroke="#ef4444" stroke-width="2"/>
    <rect x="70" y="15" width="22" height="14" fill="#fbbf24"/>
    <rect x="92" y="19" width="16" height="6" fill="#fbbf24"/>
    <path d="M0 22 C -40 22, -40 120, 100 120" fill="none" stroke="#ef4444" stroke-width="6"/>
  </g>
  <g transform="translate(60, 120)">
    <!-- White RCA -->
    <rect x="0" y="10" width="70" height="24" rx="4" fill="#222" stroke="#f8fafc" stroke-width="2"/>
    <rect x="70" y="15" width="22" height="14" fill="#fbbf24"/>
    <rect x="92" y="19" width="16" height="6" fill="#fbbf24"/>
    <path d="M0 22 C -30 22, -30 110, 100 110" fill="none" stroke="#f8fafc" stroke-width="6"/>
  </g>
  <!-- Balanced XLR Connectors -->
  <g transform="translate(230, 80)">
    <rect x="0" y="0" width="90" height="34" rx="6" fill="#1e1e2d" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="15" cy="17" r="5" fill="#38bdf8"/>
    <circle cx="35" cy="17" r="5" fill="#38bdf8"/>
    <circle cx="55" cy="17" r="5" fill="#38bdf8"/>
    <path d="M90 17 C 140 17, 140 140, 40 140" fill="none" stroke="#8b5cf6" stroke-width="8"/>
  </g>
  <text x="200" y="285" fill="#fff" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">Pro-Grade DJ Audio Interconnects</text>
  <text x="200" y="308" fill="#38bdf8" font-size="10" font-family="sans-serif" text-anchor="middle">Shielded Dual RCA &amp; Balanced XLR / TRS Pairs</text>
</svg>