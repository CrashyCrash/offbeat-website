<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%" height="100%">
  <!-- Open Display Screen -->
  <rect x="60" y="50" width="280" height="180" rx="10" fill="#08080f" stroke="#94a3b8" stroke-width="2"/>
  <rect x="70" y="60" width="260" height="160" rx="6" fill="#0f172a"/>
  <!-- DJ Software GUI on Screen -->
  <rect x="70" y="60" width="260" height="24" fill="#1e293b"/>
  <text x="80" y="76" fill="#38bdf8" font-size="10" font-family="monospace">DECK A [124.0 BPM]</text>
  <text x="260" y="76" fill="#34d399" font-size="10" font-family="monospace">DECK B [124.0]</text>
  <!-- Colorful Stacked Waveforms -->
  <path d="M75 110 Q 120 80, 160 120 T 240 90 T 325 110" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <path d="M75 140 Q 120 160, 160 130 T 240 160 T 325 140" fill="none" stroke="#ec4899" stroke-width="3"/>
  <path d="M75 170 Q 120 150, 160 180 T 240 160 T 325 170" fill="none" stroke="#34d399" stroke-width="3"/>
  <!-- Laptop Base / Keyboard -->
  <polygon points="40,240 360,240 380,265 20,265" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <rect x="150" y="248" width="100" height="12" rx="2" fill="#0f172a"/> <!-- Trackpad notch -->
  <text x="200" y="305" fill="#fff" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">Apple MacBook Air M2/M3</text>
  <text x="200" y="325" fill="#38bdf8" font-size="10" font-family="sans-serif" text-anchor="middle">Apple CoreAudio · Ultra-Low Latency</text>
</svg>