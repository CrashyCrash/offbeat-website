<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <!-- Ultra-compact Slim Chassis -->
  <rect x="15" y="20" width="570" height="280" rx="14" fill="#11101a" stroke="rgba(139,92,246,0.4)" stroke-width="2"/>
  <rect x="25" y="30" width="550" height="260" rx="10" fill="#171626"/>
  <!-- Compact Jog Wheels -->
  <circle cx="120" cy="140" r="64" fill="#0c0b14" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="120" cy="140" r="54" fill="#1c1b2c"/>
  <circle cx="120" cy="140" r="20" fill="#111"/>
  <circle cx="480" cy="140" r="64" fill="#0c0b14" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="480" cy="140" r="54" fill="#1c1b2c"/>
  <circle cx="480" cy="140" r="20" fill="#111"/>
  <!-- 4 Performance Pads per Deck -->
  <g transform="translate(60, 225)">
    <rect x="0" y="0" width="26" height="20" rx="3" fill="#222" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="32" y="0" width="26" height="20" rx="3" fill="#222" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="64" y="0" width="26" height="20" rx="3" fill="#222" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="96" y="0" width="26" height="20" rx="3" fill="#222" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <g transform="translate(420, 225)">
    <rect x="0" y="0" width="26" height="20" rx="3" fill="#222" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="32" y="0" width="26" height="20" rx="3" fill="#222" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="64" y="0" width="26" height="20" rx="3" fill="#222" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="96" y="0" width="26" height="20" rx="3" fill="#222" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <!-- Center Mixer & Smart CFX -->
  <rect x="235" y="40" width="130" height="240" rx="6" fill="#11101d" stroke="rgba(255,255,255,0.08)"/>
  <text x="300" y="60" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">DDJ-FLX2 · SMART CFX</text>
  <circle cx="270" cy="95" r="9" fill="#2a2a3c"/><circle cx="330" cy="95" r="9" fill="#2a2a3c"/>
  <circle cx="270" cy="135" r="9" fill="#2a2a3c"/><circle cx="330" cy="135" r="9" fill="#2a2a3c"/>
  <!-- Crossfader -->
  <rect x="260" y="220" width="80" height="6" rx="2" fill="#000"/><rect x="294" y="213" width="12" height="20" rx="2" fill="#fff"/>
  <text x="300" y="265" fill="#38bdf8" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">BLUETOOTH LE / USB-C</text>
</svg>