<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%" height="100%">
  <!-- Steel Base Prongs -->
  <rect x="70" y="290" width="260" height="14" rx="4" fill="#1e1e28" stroke="#8b5cf6" stroke-width="1.5"/>
  <!-- Vertical Riser Legs -->
  <rect x="110" y="90" width="18" height="205" rx="3" fill="#2a2a3c" stroke="#444"/>
  <rect x="272" y="90" width="18" height="205" rx="3" fill="#2a2a3c" stroke="#444"/>
  <!-- Top Angled Support Prongs -->
  <polygon points="90,80 150,80 140,95 80,95" fill="#38bdf8"/>
  <polygon points="250,80 310,80 300,95 240,95" fill="#38bdf8"/>
  <rect x="70" y="75" width="260" height="10" rx="3" fill="#1e1e28" stroke="#38bdf8"/>
  <text x="200" y="45" fill="#fff" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">Heavy-Duty DJ Laptop Stand</text>
  <text x="200" y="65" fill="#a78bfa" font-size="10" font-family="sans-serif" text-anchor="middle">Elevates Computer Above Controller Platters</text>
</svg>