  <rect x="305" y="173" width="20" height="12" fill="#0284c7"/>
  <text x="180" y="165" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">SanDisk</text>
  <text x="180" y="185" fill="#ef4444" font-size="10" font-weight="bold" font-family="sans-serif">Extreme PRO 128GB</text>
  <text x="200" y="275" fill="#fff" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">High-Speed Club USB 3.2</text>
  <text x="200" y="298" fill="#38bdf8" font-size="10" font-family="sans-serif" text-anchor="middle">420 MB/s Solid-State Speed for CDJs</text>
