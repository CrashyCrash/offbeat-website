    <rect x="60" y="5" width="20" height="10" fill="#fbbf24"/>
    <path d="M0 10 C -40 10, -40 120, 120 120" fill="none" stroke="#ef4444" stroke-width="6"/>
  </g>
  <!-- 1/4" TS Mono Plugs -->
