  <circle cx="500" cy="200" r="75" fill="#0a0a12" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="500" cy="200" r="68" fill="#202032"/>
  <circle cx="500" cy="200" r="28" fill="#000" stroke="#34d399" stroke-width="1.5"/>
